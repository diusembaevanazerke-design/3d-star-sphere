<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Star Sphere Hand Tracker</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#eafaff;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none}h1{font-size:clamp(20px,5vw,30px);letter-spacing:.12em;margin:0 0 6px;text-shadow:0 0 18px #27dfff}.sub{font-size:12px;color:#8bc9db;letter-spacing:.1em}.panel{position:absolute;bottom:16px;left:12px;right:12px;max-width:520px;margin:auto;padding:13px;border:1px solid #37cfee66;border-radius:20px;background:#061a2cdd;backdrop-filter:blur(12px)}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:1px solid #37cfee88;background:#0b3b53;color:#e4fbff;border-radius:25px;padding:11px 14px;font-weight:bold}button:disabled{opacity:.5}#status,#gesture{text-align:center;font-size:12px;margin-top:8px;color:#a9d8e5;min-height:16px}.help{text-align:center;font-size:11px;line-height:1.45;color:#8eb6c8;margin-top:6px}#gesture{color:#69eaff;font-weight:bold}video{display:none}
</style></head><body><canvas id="c"></canvas><div class="top"><h1>3D STAR SPHERE</h1><div class="sub">HAND TRACKING EXPERIENCE</div></div><video id="v" playsinline></video>
<div class="panel"><div class="row"><button id="start">📷 Қолмен басқаруды қосу</button><button id="stop" disabled>■ Тоқтату</button></div><div id="status">Камераны қосу үшін басып, рұқсат беріңіз.</div><div class="help">Алақанды оңға/солға жылжытыңыз — шар айналады. Қолды жақындату/алыстату — өлшемі өзгереді. Бас бармақ пен сұқ саусақты түйістіріңіз — жарқырау күшейеді.</div><div id="gesture">Қол анықталған жоқ</div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),v=document.getElementById('v');let W,H,D,pts=[],stars=[],rot=0,tilt=0,scale=1,glow=1,tracking=false,cam=null;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);pts=[];stars=[];let n=Math.min(2200,Math.floor(W*H/280)),gold=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){let y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=gold*i;pts.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,s:.45+Math.random(),p:Math.random()*6.28})}for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6.28})}
function draw(t){g.clearRect(0,0,W,H);let bg=g.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.7);bg.addColorStop(0,'#0a2940');bg.addColorStop(.55,'#041323');bg.addColorStop(1,'#01040a');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let s of stars){g.fillStyle=`rgba(150,225,255,${.15+.55*(.5+.5*Math.sin(t*.001+s.p))})`;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}let R=Math.min(W,H)*.29*scale,cx=W/2,cy=H*.47,ca=Math.cos(rot),sa=Math.sin(rot),ct=Math.cos(tilt),st=Math.sin(tilt),arr=pts.map(p=>{let x=p.x*ca-p.z*sa,z=p.x*sa+p.z*ca,y=p.y*ct-z*st,z2=p.y*st+z*ct,k=3.2/(3.2-z2*.45);return {...p,X:cx+x*R*k,Y:cy+y*R*k,Z:z2}}).sort((a,b)=>a.Z-b.Z);for(let p of arr){let d=(p.Z+1)/2;g.beginPath();g.fillStyle=`rgba(55,${Math.round(175+75*d)},255,${.2+d*.78})`;g.shadowBlur=(2+d*11)*glow;g.shadowColor='#23dfff';g.arc(p.X,p.Y,p.s*(.7+d*.9),0,7);g.fill()}g.shadowBlur=0;if(!tracking)rot+=.003;requestAnimationFrame(draw)}
function results(r){if(r.multiHandLandmarks&&r.multiHandLandmarks.length){tracking=true;let a=r.multiHandLandmarks[0],p=a[9],pinch=Math.hypot(a[4].x-a[8].x,a[4].y-a[8].y);rot+=(.5-p.x)*.035;tilt+=(.5-p.y)*.018;scale=Math.max(.72,Math.min(1.35,.8+(1-p.z)*.55));glow=pinch<.055?1.9:1;document.getElementById('gesture').textContent=pinch<.055?'✨ Саусақтар түйісті — жарқырау күшейді':'🖐 Қол табылды — шар басқарылуда'}else{tracking=false;document.getElementById('gesture').textContent='Қол анықталған жоқ'}}
async function start(){let s=document.getElementById('status');try{if(!window.Hands||!window.Camera)throw Error('MediaPipe жүктелмеді. Интернетті тексеріңіз.');s.textContent='Камера ашылуда…';let h=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});h.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.55});h.onResults(results);cam=new Camera(v,{onFrame:async()=>{await h.send({image:v})},width:640,height:480});await cam.start();document.getElementById('start').disabled=true;document.getElementById('stop').disabled=false;s.textContent='Камера қосылды. Қолыңызды көрсетіңіз.'}catch(e){s.textContent='Қате: '+e.message+'. Safari-де ашып, камераға рұқсат беріңіз.'}}
function stop(){if(cam){cam.stop();cam=null}tracking=false;document.getElementById('start').disabled=false;document.getElementById('stop').disabled=true;document.getElementById('status').textContent='Камера тоқтатылды.'}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;let down=false,x0=0,y0=0;c.addEventListener('pointerdown',e=>{down=true;x0=e.clientX;y0=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(down){rot+=(e.clientX-x0)*.009;tilt+=(e.clientY-y0)*.006;x0=e.clientX;y0=e.clientY}});c.addEventListener('pointerup',()=>down=false);addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script></body></html>
